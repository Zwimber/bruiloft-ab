<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">

<title>Gastenlijst &middot; Anna &amp; Balraz</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--navy:#11203F;--navy-deep:#0A1428;--gold:#C9A24B;--gold-deep:#9C7528;--ink:#202a3f;--muted:#4a5370;
  --serif-display:"Cormorant Garamond",Georgia,serif;--serif-body:"EB Garamond",Georgia,serif;}
*{margin:0;padding:0;box-sizing:border-box}
html{background:#e9e6df}
body{font-family:var(--serif-body);color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;background:#fff;padding:9mm 10mm 8mm;margin:0 auto;position:relative;overflow:hidden;font-size:10pt;line-height:1.25;color:var(--ink)}
.inner{height:100%;overflow:hidden;display:flex;flex-direction:column}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:4mm;padding-bottom:1.4mm;border-bottom:1px solid var(--gold);margin-bottom:1mm;flex:none}
.head .l{display:flex;align-items:flex-end;gap:3mm}
.head .crest svg{width:11mm;height:auto;display:block}
.head .eyebrow{text-transform:uppercase;letter-spacing:.32em;font-size:.82em;color:var(--gold-deep);margin-bottom:.6mm;white-space:nowrap}
.head h1{font-family:var(--serif-display);font-weight:600;font-size:3em;line-height:1;color:var(--navy)}
.head h1 em{font-style:italic;font-weight:500;color:var(--gold-deep)}
.head .r{text-align:right;font-size:.95em;color:var(--muted);font-style:italic;max-width:62mm;line-height:1.3;flex:none}
.head .r b{display:block;font-style:normal;font-family:var(--serif-display);font-weight:600;font-size:1.5em;color:var(--navy);letter-spacing:.02em}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-family:var(--serif-body);font-weight:500;text-transform:uppercase;letter-spacing:.2em;font-size:.72em;color:var(--gold-deep);text-align:left;padding:.5mm 1.2mm .7mm;border-bottom:.4pt solid var(--gold)}
th.c,td.c{text-align:center}
th{white-space:nowrap;overflow:visible}
th.c{letter-spacing:.1em}
td{padding:.55mm 1.2mm;border-bottom:.3pt solid rgba(156,117,40,.28);vertical-align:middle}
td.n{font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.f{text-align:center}
td.tbl{text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
td.s{color:var(--ink);font-size:.94em;line-height:1.2}
td.s i{color:#6b7390}
td.s .seat{color:var(--gold-deep);font-style:italic;white-space:nowrap}
.flag{display:inline-block;width:6mm;height:3.7mm;vertical-align:middle;border:.3pt solid rgba(32,42,63,.45);
  background:linear-gradient(180deg,#111 0 33.4%,#d0021b 33.4% 66.7%,#f5c400 66.7% 100%)}
.box{display:inline-block;width:4.6mm;height:4.6mm;border:.6pt solid var(--navy);border-radius:.4mm;vertical-align:middle;background:#fff}
tr.group td{padding-top:2mm;padding-bottom:.6mm;border-bottom:.4pt solid var(--gold);font-family:var(--serif-display);font-weight:600;font-size:1.3em;color:var(--navy);letter-spacing:.02em;white-space:nowrap}
tr.group td span{font-family:var(--serif-body);font-weight:400;font-size:.62em;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);margin-left:2mm}
.foot{flex:none;margin-top:auto;padding-top:1.2mm;border-top:1px solid var(--gold);display:flex;justify-content:space-between;gap:4mm;font-size:.9em;color:var(--muted);line-height:1.3;font-style:italic}
.foot .flag,.foot .box{transform:scale(.8);margin:0 .5mm 0 0}
.screen{max-width:210mm;margin:0 auto;padding:1.2rem 1rem;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;font-size:.95rem;color:var(--muted)}
.screen a{color:var(--navy);text-decoration:none;border-bottom:1px solid var(--gold)}
.page+.page{margin-top:6mm}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  .screen{display:none}
  .page,.page+.page{margin:0;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>

const PAGES=[[2,3,4],[5,6,7]];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function rowHTML(g){
  const [name,de,tbl,desc,seat]=g;
  return '<tr><td class="n">'+esc(name)+'</td><td class="f">'+(de?'<span class="flag" title="Duitstalig"></span>':'')+'</td>'+
    '<td class="tbl">'+tbl+'</td><td class="s">'+esc(desc)+(seat?(desc?' <i>&middot;</i> ':'')+'<span class="seat">'+esc(seat)+'</span>':'')+'</td>'+
    '<td class="c"><span class="box"></span></td></tr>';
}
function tableHTML(tables){
  let h='<table><colgroup><col style="width:36mm"><col style="width:12mm"><col style="width:12mm"><col><col style="width:16mm"></colgroup>'+
    '<thead><tr><th>Naam</th><th class="c">Duits</th><th class="c">Tafel</th><th>Smoelenboek</th><th class="c">Artikel</th></tr></thead><tbody>';
  for(const t of tables){
    const rows=GUESTS.filter(g=>g[2]===t);
    h+='<tr class="group"><td colspan="5">Tafel '+t+'<span>'+rows.length+' gasten</span></td></tr>'+rows.map(rowHTML).join('');
  }
  return h+'</tbody></table>';
}
function pageHTML(tables,i,n){
  const de=GUESTS.filter(g=>g[1]).length;
  return '<div class="page"><div class="inner">'+
    '<div class="head"><div class="l"><div class="crest">'+CREST+'</div><div><div class="eyebrow">Anna &amp; Balraz &middot; 17 oktober 2026 &middot; Diner</div><h1>Gastenlijst <em>tafel '+tables[0]+' t/m '+tables[tables.length-1]+'</em></h1></div></div>'+

    '<div class="foot"><div><span class="flag"></span> Duitstalig ('+de+' gasten) &nbsp;&middot;&nbsp; <span class="box"></span> afvinken als het artikel geschreven is</div><div>Bron: sheet Trouwen 2026, tabblad Gastenlijst</div></div>'+

function build(){
  document.getElementById('pages').innerHTML=PAGES.map((t,i)=>pageHTML(t,i,PAGES.length)).join('');
  fit();
}
function fit(){
  document.querySelectorAll('.page').forEach(p=>{
    const inner=p.querySelector('.inner');
    let s=10.5; p.style.fontSize=s+'pt';
    while(inner.scrollHeight>inner.clientHeight+1&&s>6.3){s-=0.1;p.style.fontSize=s.toFixed(1)+'pt';}
    p.dataset.size=s.toFixed(1);
  });
}
build();
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);}
window.addEventListener('beforeprint',fit);

</html>
