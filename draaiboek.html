'</g><text x="80" y="108" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="40" font-weight="600" fill="#C9A24B">A&amp;B</text></svg>';
const DAYS=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MONTHS=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function dateLabel(iso){const d=new Date(iso+'T12:00:00');return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()];}
function shortDate(iso){const d=new Date(iso+'T12:00:00');return DAYS[d.getDay()].slice(0,2)+' '+d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3);}
function hasRole(who,name){
  if(!who) return false;
  const toks=who.replace(/\(.*?\)/g,'').split(/[\s,&\/+]+/).filter(Boolean);
  return toks.includes('Allen')||toks.includes(name);
}
function rowHTML(r,person){
  const cls=person?(hasRole(r.who,person)?'on':'off'):'';
  const rng=(r.start||'')+(r.end?'–'+r.end:'');
  const t=(r.date==='2026-10-17')?rng:'<small>'+shortDate(r.date)+'</small>'+rng;
  const who=r.who?esc(r.who):'–';
  let wat='<span class="item">'+esc(r.item)+'</span>';
  if(r.act&&r.act.toLowerCase()!==r.item.toLowerCase()) wat+=' <span class="act">'+esc(r.act)+'</span>';
  if(r.loc) wat+=' <span class="loc">· '+esc(r.loc)+'</span>';
  if(r.note) wat+='<span class="note">'+esc(r.note)+'</span>';
  return '<tr class="'+cls+'"><td class="t">'+t+'</td><td class="w'+(r.who?'':' none')+'">'+who+'</td><td>'+wat+'</td></tr>';
}
function tableHTML(person){
  const pre=DATA.filter(r=>r.date!=='2026-10-17'), day=DATA.filter(r=>r.date==='2026-10-17');
  let h='<table><colgroup><col style="width:18.5mm"><col style="width:22mm"><col></colgroup>'+
    '<thead><tr><th>Tijd</th><th>Wie</th><th>Wat</th></tr></thead><tbody>';
  h+=day.map(r=>rowHTML(r,person)).join('');
  const preTxt=pre.map(r=>{const on=person?hasRole(r.who,person):true;return '<span class="'+(on?'on':'off')+'"><b>'+shortDate(r.date)+' '+r.start+'</b> '+esc(r.item)+(r.who?' <em>('+esc(r.who)+')</em>':'')+'</span>';}).join(' <span class="sep">&middot;</span> ');
  return '<div class="pre"><b class="lbl">Vooraf</b>'+preTxt+'</div>'+h+'</tbody></table>';
}
function pageHTML(person){
  const title=person?'Draaiboek <em>voor '+esc(person)+'</em>':'Draaiboek';
  const right=person?'<b>Achterkant</b>Jouw taken staan vol en gemarkeerd; wat grijs is, is voor een ander.':'<b>Voorkant</b>Het volledige draaiboek, voor het hele team ceremonie.';
  const legend=person?'<div class="legend"><span class="mark"></span>jouw taak &nbsp;&middot;&nbsp; <i></i>geen taak voor jou &nbsp;&middot;&nbsp; de volledige versie staat op de voorkant</div>':'';
  return '<div class="page'+(person?' personal':'')+'"><div class="inner">'+
    '<div class="head"><div class="l"><div class="crest">'+CREST+'</div><div><div class="eyebrow">Anna &amp; Balraz &middot; 17 oktober 2026 &middot; Team ceremonie</div><h1>'+title+'</h1></div></div><div class="r">'+right+'</div></div>'+
    tableHTML(person)+
    '<div class="foot">'+(person?legend:'<div><b>Sprekers</b>'+SPEAKERS+'</div><div><b>Meenemen</b>'+BRING+'</div>')+'</div>'+
    '</div></div>';
}
function build(){
  const q=new URLSearchParams(location.search);
  const who=q.get('voor');
  const people=who?[who]:TEAM;
  document.getElementById('pages').innerHTML=people.map(p=>pageHTML(null)+pageHTML(p)).join('');
  fit();
}
function fit(){
  document.querySelectorAll('.page').forEach(p=>{
    const inner=p.querySelector('.inner');
    let s=8.6; p.style.fontSize=s+'pt';
    while(inner.scrollHeight>inner.clientHeight+1&&s>6.3){s-=0.1;p.style.fontSize=s.toFixed(1)+'pt';}
    p.dataset.size=s.toFixed(1);
  });
}
build();
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);}
window.addEventListener('beforeprint',fit);
</script>
